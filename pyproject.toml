[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-audit-kit"
version = "0.1.0"
description = "Audit a backtest: look-ahead lint, ledger invariants, mutation coverage, cost checks. Pure standard library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["auditkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
