[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-audit-kit"
version = "0.1.0"
description = "Audit a backtest: look-ahead lint, ledger invariants, mutation coverage, cost checks. Pure standard library."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rytjy" }]
keywords = ["backtesting", "lookahead-bias", "audit", "trading", "quant", "mutation-testing", "invariants", "backtest-overfitting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rytjy/backtest-audit-kit"
Repository = "https://github.com/rytjy/backtest-audit-kit"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["auditkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
